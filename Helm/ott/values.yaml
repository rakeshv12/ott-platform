# ============================================================
# OTT Platform - Helm Values
# ============================================================
# This file contains environment-specific configuration.
# Kubernetes templates should consume these values instead
# of hardcoding application configuration.
# ============================================================


# ------------------------------------------------------------
# Global configuration
# ------------------------------------------------------------
global:
  environment: dev


# ------------------------------------------------------------
# Auth Service
# ------------------------------------------------------------
auth:
  replicaCount: 2

  image:
    # ECR repository will be supplied through environment values.
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3001

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi


# ------------------------------------------------------------
# Catalog Service
# ------------------------------------------------------------
catalog:
  replicaCount: 2

  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3002

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi


# ------------------------------------------------------------
# Stream Service
# ------------------------------------------------------------
stream:
  replicaCount: 2

  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3003

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi


# ------------------------------------------------------------
# Frontend
# ------------------------------------------------------------
frontend:
  replicaCount: 2

  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi


# ------------------------------------------------------------
# MinIO
# ------------------------------------------------------------
minio:
  replicaCount: 1

  image:
    repository: quay.io/minio/minio
    tag: latest
    pullPolicy: IfNotPresent

  credentials:
    rootUser: ""
    rootPassword: ""

  service:
    type: ClusterIP
    apiPort: 9000
    consolePort: 9001

  persistence:
    enabled: true
    size: 20Gi
    accessMode: ReadWriteOnce


# ------------------------------------------------------------
# Kubernetes Service Account
# ------------------------------------------------------------
serviceAccount:
  create: true
  automount: true
  name: ""


# ------------------------------------------------------------
# Ingress
# ------------------------------------------------------------
# We will configure AWS ALB later.
ingress:
  enabled: false


# ------------------------------------------------------------
# Autoscaling
# ------------------------------------------------------------
autoscaling:
  enabled: false


# ------------------------------------------------------------
# Pod security
# ------------------------------------------------------------
podSecurityContext: {}

securityContext: {}


# ------------------------------------------------------------
# Scheduling
# ------------------------------------------------------------
nodeSelector: {}

tolerations: []

affinity: {}