apiVersion: v1
kind: Service

metadata:
  name: catalog-service
  labels:
    app: catalog-service
    component: backend
    environment: {{ .Values.global.environment }}

spec:
  # Catalog is an internal backend service.
  type: {{ .Values.catalog.service.type }}

  selector:
    app: catalog-service

  ports:
    - name: http
      port: {{ .Values.catalog.service.port }}
      targetPort: http
      protocol: TCP