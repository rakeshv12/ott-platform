# Source: ott/templates/auth-deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  labels:
    app: auth-service
    component: backend
    environment: dev

spec:
  # Number of Auth service replicas.
  replicas: 2

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service
        component: backend

    spec:
      containers:

        # Auth application container
        - name: auth-service

          # Image repository and tag come from values.yaml.
          image: "416648267020.dkr.ecr.us-east-1.amazonaws.com/ott-platform-dev:auth-14fe29821db2f26a792644579c3922d68de99e73"

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3001
              protocol: TCP

          # Application configuration
          env:
            - name: PORT
              value: "3001"

            - name: POSTGRES_HOST
              value: "postgres"

            - name: REDIS_HOST
              value: "redis"

            # Database credentials come from Kubernetes Secret.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ott-secrets
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ott-secrets
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ott-secrets
                  key: POSTGRES_DB

            # JWT secret also comes from Kubernetes Secret.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ott-secrets
                  key: JWT_SECRET

          # Kubernetes uses this endpoint to determine
          # whether the application is alive.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          # Kubernetes uses this endpoint to determine
          # whether the application is ready for traffic.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          # CPU and memory are controlled through values.yaml.
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
