# Source: ott/templates/stream-deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: stream-service
  labels:
    app: stream-service
    component: backend
    environment: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: stream-service

  template:
    metadata:
      labels:
        app: stream-service
        component: backend

    spec:
      # Stream service needs its ServiceAccount because
      # it dynamically creates FFmpeg Kubernetes Jobs.
      serviceAccountName: stream-service

      containers:
        - name: stream-service

          # Repository and tag come from values-dev.yaml.
          image: "416648267020.dkr.ecr.us-east-1.amazonaws.com/ott-platform-dev:stream-14fe29821db2f26a792644579c3922d68de99e73"

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3003
              protocol: TCP

          env:
            - name: PORT
              value: "3003"

            # Internal MinIO endpoint used by Stream service.
            - name: MINIO_HOST
              value: "minio.ott-media.svc.cluster.local"

            - name: MINIO_PORT
              value: "9000"

            # MinIO credentials should eventually come from
            # a Kubernetes Secret rather than plain text.
            - name: MINIO_ROOT_USER
              value: "minioadmin"

            - name: MINIO_ROOT_PASSWORD
              value: "minioadmin123"

            # Temporary dev configuration for the existing
            # MinIO external access path.
            - name: MINIO_EXTERNAL_HOST
              value: "192.168.1.246"

            - name: MINIO_EXTERNAL_PORT
              value: "9000"

            - name: MINIO_PUBLIC_URL
              value: "http://192.168.1.246:9000"

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
# Source: ott/templates/minio-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: minio
  namespace: ott-media
  labels:
    app: minio
    component: media
    environment: dev

spec:
  replicas: 1

  serviceName: minio

  selector:
    matchLabels:
      app: minio

  template:
    metadata:
      labels:
        app: minio
        component: media

    spec:
      containers:
        - name: minio

          image: "quay.io/minio/minio:latest"

          imagePullPolicy: IfNotPresent

          ports:
            - name: api
              containerPort: 9000
              protocol: TCP

            - name: console
              containerPort: 9001
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 30
            periodSeconds: 10

          command:
            - minio
            - server
            - /data
            - --console-address
            - ":9001"

          env:
            # Credentials will come from a Kubernetes Secret.
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER

            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD

          volumeMounts:
            - name: minio-data
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: minio-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 20Gi
