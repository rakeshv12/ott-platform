version: 0.2

phases:

  install:
    commands:
      # Display the deployment tools available in the CodeBuild environment.
      - echo "Starting OTT platform deployment..."
      - aws --version
      - kubectl version --client=true
      - helm version

  pre_build:
    commands:
      # Configure kubectl to communicate with the target EKS cluster.
      - echo "Configuring kubectl for EKS..."
      - aws eks update-kubeconfig --region "$AWS_DEFAULT_REGION" --name "$EKS_CLUSTER_NAME"

      # Verify that the EKS cluster is reachable.
      - echo "Checking EKS cluster connectivity..."
      - kubectl cluster-info

      # Read-only verification of the EKS worker nodes.
      - echo "Checking EKS worker nodes..."
      - kubectl get nodes

      # Display the Git commit that this deployment is using.
      - echo "Deploying source version: $CODEBUILD_RESOLVED_SOURCE_VERSION"

  build:
    commands:
      # Deploy the OTT platform using Helm.
      # The image tags must match the tags created by buildspec.yml.
      - echo "Deploying OTT platform with Helm..."

      - helm upgrade --install "$HELM_RELEASE_NAME" "$HELM_CHART_PATH" \
          --namespace "$BACKEND_NAMESPACE" \
          --create-namespace \
          -f "$HELM_VALUES_FILE" \
          --set auth.image.repository="$ECR_REPOSITORY_URL" \
          --set auth.image.tag="auth-$CODEBUILD_RESOLVED_SOURCE_VERSION" \
          --set catalog.image.repository="$ECR_REPOSITORY_URL" \
          --set catalog.image.tag="catalog-$CODEBUILD_RESOLVED_SOURCE_VERSION" \
          --set stream.image.repository="$ECR_REPOSITORY_URL" \
          --set stream.image.tag="stream-$CODEBUILD_RESOLVED_SOURCE_VERSION" \
          --set frontend.image.repository="$ECR_REPOSITORY_URL" \
          --set frontend.image.tag="frontend-$CODEBUILD_RESOLVED_SOURCE_VERSION"

  post_build:
    commands:
      # Display the final deployment status.
      - echo "OTT platform Helm deployment completed."