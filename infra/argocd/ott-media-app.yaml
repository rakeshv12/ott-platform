apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ott-media
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rakeshv12/ott-platform.git
    targetRevision: main
    path: k8s/ott-media
  destination:
    namespace: ott-media
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true