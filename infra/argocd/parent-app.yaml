apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ott-platform-parent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rakeshv12/ott-platform.git
    targetRevision: main
    path: infra/argocd          # watches this folder for child apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
