version: 0.2

phases:

  pre_build:
    commands:
      # Display basic build information.
      - echo "Starting OTT platform Docker build..."

      # Authenticate Docker with Amazon ECR.
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY_URL

  build:
    commands:
      # Build the Auth service image.
      #
      # BASE_IMAGE_REPOSITORY points to our trusted ECR repository
      # containing the node:20-alpine base image.
      - echo "Building Auth service..."
      - docker build --build-arg BASE_IMAGE_REPOSITORY=$BASE_IMAGE_REPOSITORY -t $ECR_REPOSITORY_URL:auth-$CODEBUILD_RESOLVED_SOURCE_VERSION ./backend/auth

      # Build the Catalog service image.
      - echo "Building Catalog service..."
      - docker build --build-arg BASE_IMAGE_REPOSITORY=$BASE_IMAGE_REPOSITORY -t $ECR_REPOSITORY_URL:catalog-$CODEBUILD_RESOLVED_SOURCE_VERSION ./backend/catalog

      # Build the Stream service image.
      - echo "Building Stream service..."
      - docker build --build-arg BASE_IMAGE_REPOSITORY=$BASE_IMAGE_REPOSITORY -t $ECR_REPOSITORY_URL:stream-$CODEBUILD_RESOLVED_SOURCE_VERSION ./backend/stream

      # Build the Frontend image.
      - echo "Building Frontend..."
      - docker build --build-arg BASE_IMAGE_REPOSITORY=$BASE_IMAGE_REPOSITORY -t $ECR_REPOSITORY_URL:frontend-$CODEBUILD_RESOLVED_SOURCE_VERSION ./frontend/web

  post_build:
    commands:
      # Push all service images to ECR.
      - echo "Pushing Auth image..."
      - docker push $ECR_REPOSITORY_URL:auth-$CODEBUILD_RESOLVED_SOURCE_VERSION

      - echo "Pushing Catalog image..."
      - docker push $ECR_REPOSITORY_URL:catalog-$CODEBUILD_RESOLVED_SOURCE_VERSION

      - echo "Pushing Stream image..."
      - docker push $ECR_REPOSITORY_URL:stream-$CODEBUILD_RESOLVED_SOURCE_VERSION

      # Push Frontend image to ECR.
      - echo "Pushing Frontend image..."
      - docker push $ECR_REPOSITORY_URL:frontend-$CODEBUILD_RESOLVED_SOURCE_VERSION

      - echo "OTT platform images successfully pushed to ECR."