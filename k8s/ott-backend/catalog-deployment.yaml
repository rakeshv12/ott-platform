apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: ott-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: my-docker
      containers:
        - name: catalog-service
          image: rakeshv12/ott-catalog-service:latest
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: POSTGRES_HOST
              value: "postgres"
            - name: REDIS_HOST
              value: "redis"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ott-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ott-secrets
                  key: POSTGRES_PASSWORD
            - name: CATALOG_DB
              value: "catalogdb"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: ott-backend
spec:
  selector:
    app: catalog-service
  ports:
    - port: 3002
      targetPort: 3002