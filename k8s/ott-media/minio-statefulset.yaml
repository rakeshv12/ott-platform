apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: ott-media
spec:
  replicas: 1
  serviceName: minio
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: quay.io/minio/minio
        ports:
          - containerPort: 9000
          - containerPort: 9001
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            port: 9000
            path: /minio/health/ready
          initialDelaySeconds: 30
          periodSeconds: 10
        command:
          - minio
          - server
          - /data
          - --console-address
          - ":9001"
        env:
          - name: MINIO_ROOT_USER
            value: "minioadmin"
          - name: MINIO_ROOT_PASSWORD
            value: "minioadmin123"
        volumeMounts:
          - name: minio-data
            mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---

apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: ott-media
spec:
  selector:
    app: minio
  type: LoadBalancer
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001



         
